<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
           Auth App 
        {% endblock %}
    </title>
        <style>
        body { font-family: Arial, sans-serif; background: #f2f4f8; margin: 0; }
        nav { background: #2c3e50; padding: 12px 24px; }
        nav a { color: white; margin-right: 16px; text-decoration: none; }
        .card { max-width: 400px; margin: 40px auto; background: white;
                padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        input { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2c3e50; color: white;
                 border: none; border-radius: 4px; cursor: pointer; }
        .msg { padding: 10px; margin-bottom: 12px; border-radius: 4px; background: #dff0d8; }
        .errorlist { color: red; padding-left: 16px; }
        .helptext { font-size: 12px; color: #777; }
    </style>

</head>
<body>
    <nav>
        {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'logout' %}">Logout</a>

        {% else %}
        <a href="{% url "register" %}">Register</a>
        <a href="{% url "login" %}">Login</a>

        {% endif %}
    </nav>

    <div class="card">
        {% for message in messages%}
        <div class="msg">
            {{message}}
        </div>
        {% endfor %}

        {%block content%}
        {% endblock %}
    </div>
</body>
</html>
